      - price_drop
      - volume_spike
      - volatility_spike
      - new_52_week_high
      - new_52_week_low
      - unusual_market_activity

    access:
      type: internal_stream

    streaming: true

    target_layer: silver

    priority: critical

  financial_metrics:
