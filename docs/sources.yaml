# =============================================================================
# SOURCE GROUPS
# =============================================================================

source_groups:

  us_equities:
    sources:
      - sec_edgar
      - twelve_data
      - alpha_vantage
      - fred
      - openfigi
      - gleif

  brazil_equities:
    sources:
      - b3
      - cvm
      - banco_central_brasil
      - ibge
      - openfigi
      - gleif

  macro:
    sources:
      - fred
      - banco_central_brasil
      - ibge
      - world_bank
      - imf
      - ecb

  energy:
    sources:
      - eia
      - alpha_vantage

  news:
    sources:
      - gdelt
      - rss_feeds
      - newsapi

  identifiers:
    sources:
      - openfigi
      - gleif

  streaming_candidates:
    sources:
      - twelve_data
      - polygon
      - finnhub
      - coinbase
      - binance


# =============================================================================
# SOURCE AUTHORITY
# =============================================================================

authority:

  company_filings:
    brazil:
      primary: cvm

    united_states:
      primary: sec_edgar

  brazil_exchange_reference:
    primary: b3

  brazil_macro:
    primary:
      - banco_central_brasil
      - ibge

  us_macro:
    primary: fred

  company_identifiers:
    primary:
      - openfigi
      - gleif

  energy:
    primary: eia


# =============================================================================
# INGESTION TIERS
# =============================================================================

ingestion_tiers:

  tier_0:
    description: Required to make the first usable version of the platform.

    sources:
      - sec_edgar
      - cvm
      - twelve_data
      - banco_central_brasil
      - fred

  tier_1:
    description: Adds company identity, macro context and event intelligence.

    sources:
      - openfigi
      - gleif
      - ibge
      - gdelt
      - eia

  tier_2:
    description: Alternative providers and broader market coverage.

    sources:
      - alpha_vantage
      - financial_modeling_prep
      - finnhub
      - polygon
      - world_bank
      - imf
      - ecb

  tier_3:
    description: Optional datasets and additional asset classes.

    sources:
      - nasdaq_data_link
      - newsapi
      - coinbase
      - binance
      - stooq


# =============================================================================
# INGESTION MODES
# =============================================================================

ingestion_modes:

  batch:
    - sec_edgar
    - cvm
    - b3
    - banco_central_brasil
    - ibge
    - fred
    - world_bank
    - imf
    - ecb
    - eia
    - openfigi
    - gleif

  micro_batch:
    - alpha_vantage
    - financial_modeling_prep
    - gdelt
    - rss_feeds

  streaming:
    - twelve_data
    - polygon
    - finnhub
    - coinbase
    - binance


# =============================================================================
# DATA DOMAINS
# =============================================================================

domains:

  market:
    datasets:
      - securities
      - exchanges
      - quotes
      - trades
      - candles
      - indices
      - order_books

  company:
    datasets:
      - companies
      - legal_entities
      - securities
      - company_profiles
      - sectors
      - industries

  fundamentals:
    datasets:
      - income_statements
      - balance_sheets
      - cash_flow_statements
      - financial_ratios
      - earnings

  corporate_actions:
    datasets:
      - dividends
      - splits
      - mergers
      - acquisitions
      - spin_offs

  filings:
    datasets:
      - regulatory_filings
      - annual_reports
      - quarterly_reports
      - material_events

  macro:
    datasets:
      - interest_rates
      - inflation
      - gdp
      - employment
      - exchange_rates
      - commodities

  intelligence:
    datasets:
      - news
      - sentiment
      - market_events
      - anomalies
      - research_reports
