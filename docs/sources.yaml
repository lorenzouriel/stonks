```yaml
version: "1.0"

project:
  name: the-stocks
  description: >
    Canonical registry of external data sources used by the-stocks.
    Sources are classified by domain, access pattern, licensing,
    expected freshness, and their intended role in the platform.

defaults:
  timezone: UTC
  ingestion:
    retries: 3
    timeout_seconds: 30
  storage:
    raw_layer: bronze
    normalized_layer: silver
    curated_layer: gold

sources:

  # ==========================================================================
  # MARKET DATA
  # ==========================================================================

  alpha_vantage:
    name: Alpha Vantage
    category: market_data
    provider_type: commercial_api
    enabled: true

    capabilities:
      - historical_prices
      - intraday_prices
      - quotes
      - equities
      - etfs
      - forex
      - crypto
      - commodities
      - technical_indicators
      - fundamentals
      - news
      - sentiment

    markets:
      - global

    access:
      type: rest_api
      authentication: api_key
      streaming: false
      batch: true

    formats:
      - json
      - csv

    freshness:
      historical: true
      intraday: true
      realtime: limited

    cost:
      model: freemium

    use_cases:
      - bootstrap_market_data
      - historical_prices
      - reference_market_data
      - prototyping

    priority: medium

    notes: >
      Broad API with equities, ETFs, fundamentals, macroeconomic data,
      commodities, forex, crypto and news. Useful as a bootstrap source,
      although rate limits make it less attractive as the main production
      market feed.

  twelve_data:
    name: Twelve Data
    category: market_data
    provider_type: commercial_api
    enabled: true

    capabilities:
      - historical_prices
      - intraday_prices
      - quotes
      - equities
      - etfs
      - forex
      - crypto
      - indices
      - technical_indicators

    markets:
      - global

    access:
      type: rest_api
      authentication: api_key
      streaming: true
      batch: true

    formats:
      - json
      - csv

    freshness:
      historical: true
      intraday: true
      realtime: true

    cost:
      model: freemium

    use_cases:
      - primary_market_api_candidate
      - streaming_quotes
      - historical_prices
      - multi_asset_support

    priority: high

  polygon:
    name: Polygon
    category: market_data
    provider_type: commercial_api
    enabled: false

    capabilities:
      - trades
      - quotes
      - aggregates
      - historical_prices
      - realtime_prices
      - options
      - forex
      - crypto
      - reference_data
      - corporate_actions

    markets:
      - us

    access:
      type:
        - rest_api
        - websocket
      authentication: api_key
      streaming: true
      batch: true

    freshness:
      historical: true
      intraday: true
      realtime: true

    cost:
      model: paid

    use_cases:
      - realtime_market_feed
      - trade_events
      - quote_events
      - market_microstructure

    priority: medium

  finnhub:
    name: Finnhub
    category: market_data
    provider_type: commercial_api
    enabled: false

    capabilities:
      - realtime_quotes
      - historical_prices
      - company_profiles
      - fundamentals
      - earnings
      - estimates
      - news
      - insider_transactions
      - economic_data

    markets:
      - global

    access:
      type:
        - rest_api
        - websocket
      authentication: api_key
      streaming: true
      batch: true

    cost:
      model: freemium

    use_cases:
      - company_intelligence
      - market_streaming
      - earnings
      - news

    priority: medium

  financial_modeling_prep:
    name: Financial Modeling Prep
    category: market_data
    provider_type: commercial_api
    enabled: false

    capabilities:
      - historical_prices
      - company_profiles
      - financial_statements
      - financial_ratios
      - valuation_metrics
      - earnings
      - analyst_estimates
      - dividends
      - splits

    markets:
      - global

    access:
      type: rest_api
      authentication: api_key
      streaming: limited
      batch: true

    cost:
      model: freemium

    use_cases:
      - fundamentals
      - derived_financial_metrics
      - company_reference_data

    priority: medium

  nasdaq_data_link:
    name: Nasdaq Data Link
    category: market_data
    provider_type: data_marketplace
    enabled: false

    capabilities:
      - historical_market_data
      - alternative_data
      - fundamentals
      - economic_data
      - institutional_data

    access:
      type: rest_api
      authentication: api_key
      streaming: false
      batch: true

    cost:
      model: mixed

    use_cases:
      - alternative_datasets
      - research
      - historical_data

    priority: low

  yahoo_finance:
    name: Yahoo Finance
    category: market_data
    provider_type: unofficial_api
    enabled: true

    capabilities:
      - historical_prices
      - quotes
      - dividends
      - splits
      - basic_fundamentals
      - company_metadata

    markets:
      - global

    access:
      type: unofficial_http
      authentication: none
      streaming: false
      batch: true

    cost:
      model: free

    use_cases:
      - development
      - experimentation
      - fallback_data

    restrictions:
      production_recommended: false
      redistribution_review_required: true

    priority: low

    notes: >
      Useful for development and experimentation but should not become
      a critical production dependency because it is not a stable,
      contracted market-data API.

  stooq:
    name: Stooq
    category: market_data
    provider_type: public_data
    enabled: false

    capabilities:
      - historical_prices
      - indices
      - equities
      - forex

    access:
      type: file_download
      authentication: none
      streaming: false
      batch: true

    cost:
      model: free

    use_cases:
      - historical_backfills
      - research
      - testing

    priority: low

  # ==========================================================================
  # BRAZIL
  # ==========================================================================

  b3:
    name: B3
    organization: B3 S.A. - Brasil Bolsa Balcão
    category: exchange_data
    provider_type: exchange
    enabled: true

    capabilities:
      - securities
      - historical_prices
      - trading_volume
      - corporate_actions
      - indices
      - derivatives
      - reference_data

    markets:
      - brazil

    access:
      type:
        - files
        - commercial_market_data
      authentication: varies
      streaming: commercial
      batch: true

    freshness:
      historical: true
      daily: true
      realtime: commercial

    cost:
      model: mixed

    use_cases:
      - brazilian_security_master
      - exchange_reference_data
      - brazil_market_validation

    restrictions:
      automated_collection_review_required: true
      redistribution_review_required: true
      licensing_review_required: true

    priority: critical

    notes: >
      B3 is the authoritative exchange source for Brazilian listed assets.
      Public historical files have specific terms of use and should not
      automatically be treated as unrestricted machine-readable data.

  cvm:
    name: Comissão de Valores Mobiliários
    category: regulatory_filings
    provider_type: government_open_data
    enabled: true

    capabilities:
      - company_registry
      - financial_statements
      - regulatory_filings
      - fund_data
      - corporate_documents
      - reference_data

    markets:
      - brazil

    access:
      type:
        - csv
        - file_download
        - open_data_portal
      authentication: none
      streaming: false
      batch: true

    freshness:
      company_registry: daily
      filings: periodic

    cost:
      model: free

    use_cases:
      - brazil_company_master
      - financial_statements
      - filings
      - issuer_resolution
      - fundamentals

    priority: critical

  banco_central_brasil:
    name: Banco Central do Brasil
    aliases:
      - BCB
      - BACEN

    category: macroeconomic_data
    provider_type: government_api
    enabled: true

    capabilities:
      - selic
      - interest_rates
      - inflation
      - exchange_rates
      - credit
      - monetary_statistics
      - financial_system_statistics

    markets:
      - brazil

    access:
      type:
        - rest_api
        - time_series_api
      authentication: none
      streaming: false
      batch: true

    use_cases:
      - brazil_macro_context
      - risk_free_rate
      - fx_context
      - monetary_policy_analysis

    priority: critical

  ibge:
    name: Instituto Brasileiro de Geografia e Estatística
    category: macroeconomic_data
    provider_type: government_api
    enabled: true

    capabilities:
      - inflation
      - gdp
      - employment
      - demographics
      - industrial_production
      - retail_sales
      - economic_statistics

    markets:
      - brazil

    access:
      type:
        - rest_api
        - files
      authentication: none
      streaming: false
      batch: true

    cost:
      model: free

    use_cases:
      - brazil_macro_analysis
      - economic_regime_detection
      - sector_context

    priority: high

  tesouro_nacional:
    name: Tesouro Nacional
    category: fixed_income
    provider_type: government_data
    enabled: false

    capabilities:
      - sovereign_bonds
      - treasury_rates
      - public_debt
      - fiscal_data

    markets:
      - brazil

    access:
      type:
        - api
        - files
      streaming: false
      batch: true

    cost:
      model: free

    use_cases:
      - sovereign_yield_curve
      - fixed_income_context
      - fiscal_analysis

    priority: medium

  # ==========================================================================
  # UNITED STATES REGULATORY DATA
  # ==========================================================================

  sec_edgar:
    name: SEC EDGAR
    organization: U.S. Securities and Exchange Commission
    category: regulatory_filings
    provider_type: government_api
    enabled: true

    capabilities:
      - company_filings
      - company_metadata
      - 10_k
      - 10_q
      - 8_k
      - 20_f
      - 6_k
      - xbrl_facts
      - financial_statements
      - filing_documents

    markets:
